name: Deploy to Prod
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: liberture-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
          RESEND_API_KEY: re_localbuild
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Deploy Liberture release
        env:
          DEPLOY_KEY: ${{ secrets.LIBERTURE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIBERTURE_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          umask 077
          sshdir=$(mktemp -d)
          trap 'rm -rf "$sshdir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$sshdir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$sshdir/known_hosts"
          unset DEPLOY_KEY
          tar --exclude=.next/cache -czf - .next public next.config.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml prisma/schema.prisma prisma/migrations/20261113000000_better_auth/migration.sql scripts/migrate-managed-auth.mjs scripts/managed-auth-backfill.sql data scripts/seed-directory-quick.ts scripts/seed-marketplace-protocols.ts lib tsconfig.json |
            ssh -T -i "$sshdir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=liberture-production -o UserKnownHostsFile="$sshdir/known_hosts" "liberture-deploy@$SSH_HOST"
