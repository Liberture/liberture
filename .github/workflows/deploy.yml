name: Deploy to Prod
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: liberture-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release version and commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/master
          grep -Fxq "## ${RELEASE_TAG#v}" CHANGELOG.md
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
          RESEND_API_KEY: re_localbuild
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Deploy Liberture release
        env:
          DEPLOY_KEY: ${{ secrets.LIBERTURE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIBERTURE_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          umask 077
          sshdir=$(mktemp -d)
          trap 'rm -rf "$sshdir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$sshdir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$sshdir/known_hosts"
          unset DEPLOY_KEY
          tar --exclude=.next/cache -czf - .next public next.config.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml prisma/schema.prisma prisma/migrations scripts/migrate-managed-auth.mjs scripts/managed-auth-backfill.sql scripts/seed-marketplace-protocols.ts lib tsconfig.json |
            ssh -T -i "$sshdir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=liberture-production -o UserKnownHostsFile="$sshdir/known_hosts" "liberture-deploy@$SSH_HOST"
