name: Deploy to Prod

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build Next.js app
        env:
          NEXT_DISABLE_TURBOPACK: "1"
        run: pnpm run build

      - name: Upload production files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY}}
          source: ".next,public,next.config.mjs,package.json,pnpm-lock.yaml,.env,prisma,data,scripts,lib,tsconfig.json"
          target: /var/www/liberture
          overwrite: true

      - name: Restart app via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export CI=true
            cd /var/www/liberture
            npm i -g pnpm@10 || true
            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm exec prisma db push --skip-generate --accept-data-loss || true
            pnpm exec tsx scripts/seed-directory-quick.ts || true
            pnpm exec tsx scripts/seed-marketplace-protocols.ts || true
            export PORT=3033
            pm2 delete liberture || true
            pm2 start "pnpm run start" --name liberture
            pm2 save
            for i in $(seq 1 15); do
              sleep 2
              curl -sf -o /dev/null http://localhost:3033/ && echo "App is serving" && exit 0
            done
            echo "App failed to serve after restart:"
            pm2 logs liberture --lines 50 --nostream
            exit 1