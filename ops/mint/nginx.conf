limit_req_zone $binary_remote_addr zone=cashu_ip:1m rate=90r/m;
limit_req_zone $server_name zone=cashu_all:1m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=cashu_conn:1m;
map "$request_method:$uri" $cashu_allowed {
    default 0;
    ~^GET:/v1/(info|keys|keysets)$ 1;
    ~^GET:/v1/keys/[a-zA-Z0-9_-]+$ 1;
    ~^GET:/v1/(mint|melt)/quote/bolt11/[a-zA-Z0-9_-]+$ 1;
    ~^POST:/v1/((mint|melt)/(quote/)?bolt11|swap|checkstate|restore)$ 1;
    ~^OPTIONS:/v1/ 1;
}
map $request_method $cashu_writer { default ""; POST $binary_remote_addr; }
limit_req_zone $cashu_writer zone=cashu_writes:1m rate=20r/m;
server {
    listen 80;
    server_name mint.nostrwot.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nostrwot-mint-acme; }
    location / { return 301 https://mint.nostrwot.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name mint.nostrwot.com;
    ssl_certificate /etc/letsencrypt/live/mint.nostrwot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mint.nostrwot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    limit_conn cashu_conn 8;
    limit_conn_status 429;
    limit_req_status 429;
    location / {
        if ($cashu_allowed = 0) { return 404; }
        if ($args != "") { return 400; }
        limit_req zone=cashu_ip burst=16 nodelay;
        limit_req zone=cashu_all burst=24 nodelay;
        limit_req zone=cashu_writes burst=6 nodelay;
        proxy_pass http://127.0.0.1:3348;
        proxy_read_timeout 25s;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "private, no-store" always;
    }
}
